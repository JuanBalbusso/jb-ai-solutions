<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nos mudamos a copperbotai.com</title>
<meta http-equiv="refresh" content="0; url=https://copperbotai.com">
<link rel="canonical" href="https://copperbotai.com">
<meta name="robots" content="noindex, follow">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{--bg:#0d0d0d;--ink:#f5efe9;--muted:#a89d94;--orange:#e8621a;--orange-bright:#ff7a30;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;}
  h1{font-size:clamp(1.6rem,5vw,2.4rem);font-weight:800;line-height:1.2;margin-bottom:0.75rem;}
  h1 span{color:var(--orange-bright);}
  p{color:var(--muted);margin-bottom:1.75rem;}
  a{display:inline-block;padding:0.85rem 1.75rem;border-radius:999px;background:var(--orange);color:#fff;font-weight:700;text-decoration:none;box-shadow:0 8px 24px rgba(232,98,26,0.32);transition:background 0.2s;}
  a:hover{background:var(--orange-bright);}
</style>
</head>
<body>
  <main>
    <h1>Nos mudamos a <span>copperbotai.com</span></h1>
    <p>Te estamos redirigiendo…</p>
    <a href="https://copperbotai.com">Ir a copperbotai.com →</a>
  </main>
</body>
